name: Fix character persistence source of truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-persistence-source-of-truth.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch character persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Firestore writes must persist exactly what the Admin UI sends.
          #    Never run syncCharacterHealth() before setDoc(); that function is
          #    a derived/recovery layer and can resurrect deleted modifiers.
          p = Path('src/services/characterService.ts')
          s = p.read_text()
          pattern = r"export async function updateCharacterData\(char: CharacterProfile\): Promise<void> \{.*?\n\}\n\n// Delete Character"
          replacement = '''export async function updateCharacterData(char: CharacterProfile): Promise<void> {
  const score = calculatePowerScore(char);
  const previousVersion = Number(localCharacters.find(c => c.id === char.id)?.lastUpdated) || 0;
  const requestedVersion = Number(char.lastUpdated) || 0;
  const lastUpdated = Math.max(Date.now(), previousVersion + 1, requestedVersion);
  const updated: CharacterProfile = { ...char, powerScore: score, lastUpdated };

  pendingCharacterUpdates.set(updated.id, updated);
  localCharacters = localCharacters.map(c => c.id === updated.id ? updated : c);
  if (!localCharacters.some(c => c.id === updated.id)) localCharacters.push(updated);
  saveLocalAll();
  broadcast?.postMessage({ type: 'CHARACTERS_UPDATE' });

  try {
    await setDoc(doc(db, CHARACTERS_COLLECTION, updated.id), sanitizeForFirestore(updated));
  } catch (err) {
    pendingCharacterUpdates.delete(updated.id);
    console.error("Error updating character in Firestore:", err);
    throw err;
  }
}

// Delete Character'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('updateCharacterData pattern not found')

          # 2) Firestore is authoritative after a successful server snapshot.
          #    Do not re-derive HP/stats/skills from old snapshots or local overlay.
          #    The Admin UI already writes the resolved values to Firestore.
          old = "const synced = syncCharacterHealth(source);"
          if old not in s:
              raise SystemExit('subscribe sync line not found')
          s = s.replace(old, "const synced = source;", 1)

          # Remove the old automatic HP rewrite. It could write a derived/old value
          # back into Firestore immediately after an admin edit.
          auto = r"\n        // Auto-fix legacy inflated HP or corrupted values in Firestore\n        if \(\n          raw\.maxHp !== synced\.maxHp \|\|\n          raw\.hp > synced\.maxHp \|\|\n          \(raw\.maxHp && raw\.maxHp > 200\) \|\|\n          raw\.maxHp === 1500 \|\|\n          raw\.maxHp === 800 \|\|\n          raw\.maxHp === 950\n        \) \{\n          updateDoc\(docSnap\.ref, \{\n            hp: synced\.hp,\n            maxHp: synced\.maxHp,\n            powerScore: calculatePowerScore\(synced\),\n          \}\)\.catch\(\(\) => \{\}\);\n        \}"
          s, removed = re.subn(auto, '', s, count=1)
          if removed != 1:
              raise SystemExit('old auto-fix block not found')

          p.write_text(s)
          PY

          # 3) Validate the two critical UI persistence paths. This does not alter
          #    the UI behavior; it ensures the deletion code is present.
          grep -q "adminBalanceModifiers" src/components/AdminCharacterBalancePanel.tsx
          grep -q "adminBalanceSnapshot" src/components/AdminCharacterBalancePanel.tsx

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/characterService.ts
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix: persist exact admin HP stat skill and status edits"
          git push