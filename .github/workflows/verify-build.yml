name: verify-build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose StatusWindow parser
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/components/StatusWindow.tsx', 'utf8');
          fs.writeFileSync('src/components/__StatusWindowTest.tsx', src + '\n}');
          NODE
          pnpm exec tsc --noEmit src/components/__StatusWindowTest.tsx --jsx react-jsx --module ESNext --moduleResolution Bundler --target ES2022 --skipLibCheck --allowImportingTsExtensions --esModuleInterop --isolatedModules 2>&1 | tail -80 || true
          rm -f src/components/__StatusWindowTest.tsx
      - name: Locate missing StatusWindow brace
        run: |
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const src = fs.readFileSync('src/components/StatusWindow.tsx','utf8') + '\n}';
          const sf = ts.createSourceFile('StatusWindow.tsx', src, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
          function walk(node, parents=[]) {
            if (node.kind === ts.SyntaxKind.ReturnStatement) {
              const pos=sf.getLineAndCharacterOfPosition(node.pos);
              console.log('RETURN',pos.line+1,pos.character+1,'ancestors',parents.map(p=>ts.SyntaxKind[p.kind]).join(' > '));
            }
            ts.forEachChild(node, n=>walk(n,[...parents,node]));
          }
          walk(sf);
          console.log('DIAGNOSTICS', sf.parseDiagnostics.map(d=>ts.flattenDiagnosticMessageText(d.messageText,' ')));
          NODE
      - name: Inspect StatusWindow AST
        run: |
          node - <<'NODE'
          const ts=require('typescript'),fs=require('fs');
          const src=fs.readFileSync('src/components/StatusWindow.tsx','utf8')+'\n}';
          const sf=ts.createSourceFile('StatusWindow.tsx',src,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
          const vd=sf.statements.find(s=>s.kind===ts.SyntaxKind.FirstStatement);
          const decl=vd?.declarationList?.declarations?.find(d=>d.name?.getText(sf)==='StatusWindow');
          const body=decl?.initializer?.body;
          console.log('BODY',body?.kind, body && sf.getLineAndCharacterOfPosition(body.pos));
          if(body?.statements) for(const s of body.statements) console.log('STMT',ts.SyntaxKind[s.kind],sf.getLineAndCharacterOfPosition(s.pos).line+1,s.getText(sf).slice(0,120).replace(/\n/g,' '));
          NODE
      - run: pnpm run typecheck
      - run: pnpm run build
