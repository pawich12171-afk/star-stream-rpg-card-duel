name: Fix skill BUFF NERF deletion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch admin skill deletion snapshot revision
        shell: bash
        run: |
          file="src/components/AdminCharacterBalancePanel.tsx"
          old='const snapshot=target.adminBalanceSnapshot||cloneSnapshot(target);'
          new='const snapshot={...(target.adminBalanceSnapshot||cloneSnapshot(target)),capturedAt:Date.now()};'
          if ! grep -Fq "$old" "$file"; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/AdminCharacterBalancePanel.tsx")
          s = p.read_text(encoding="utf-8")
          old = "const snapshot=target.adminBalanceSnapshot||cloneSnapshot(target);"
          new = "const snapshot={...(target.adminBalanceSnapshot||cloneSnapshot(target)),capturedAt:Date.now()};"
          if old not in s:
              raise SystemExit("target text not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "fix: prevent deleted skill modifiers from returning"
          git push
