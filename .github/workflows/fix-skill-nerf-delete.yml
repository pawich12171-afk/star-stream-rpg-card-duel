name: Fix skill BUFF NERF deletion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch admin skill and overlay sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/utils/healthSystem.ts")
          s = p.read_text(encoding="utf-8")

          old = """    const modifiers = character.adminBalanceModifiers || [];
    const snapshot = character.adminBalanceSnapshot;
    if (!modifiers.length || !snapshot) return;"""
          new = """    const modifiers = character.adminBalanceModifiers || [];
    const snapshot = character.adminBalanceSnapshot;
    // Delete stale recovery data when the last admin modifier is removed.
    if (!modifiers.length || !snapshot) {
      localStorage.removeItem(overlayKey(character.id));
      return;
    }"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """  persistAdminOverlay({ ...working, adminBalanceSnapshot: { ...snapshot, maxHp: baseMaxHp } });

  return {
    ...working,
    hp: targetHp,
    maxHp: targetMaxHp,
    stats: { ...snapshot.stats },
    skills: (snapshot.skills || []).map(s => ({ ...s })),
  };"""
          new = """  // Rebuild admin-modified stats and skills from the original snapshot.
  // Without this, syncCharacterHealth restored skills to the snapshot level
  // and caused BUFF/NERF changes to jump back after realtime updates.
  const effectiveStats = { ...snapshot.stats };
  (['strength', 'durability', 'agility', 'magic'] as const).forEach((key) => {
    const delta = modifiers
      .filter(m => m.kind === 'stat' && m.stat === key)
      .reduce((sum, m) => sum + signedAdminModifier(m), 0);
    effectiveStats[key] = Math.max(0, Number(snapshot.stats[key] || 0) + delta);
  });

  const effectiveSkills = (snapshot.skills || []).map((baseSkill) => {
    const delta = modifiers
      .filter(m => m.kind === 'skill' && m.skillId === baseSkill.id)
      .reduce((sum, m) => sum + signedAdminModifier(m), 0);
    const maxLevel = Math.max(Number(baseSkill.maxLevel || 10), 1);
    return {
      ...baseSkill,
      level: Math.max(1, Math.min(maxLevel, Number(baseSkill.level || 1) + delta)),
    };
  });

  persistAdminOverlay({
    ...working,
    stats: effectiveStats,
    skills: effectiveSkills,
    adminBalanceSnapshot: { ...snapshot, maxHp: baseMaxHp },
  });

  return {
    ...working,
    hp: targetHp,
    maxHp: targetMaxHp,
    stats: effectiveStats,
    skills: effectiveSkills,
  };"""
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/healthSystem.ts
          if git diff --cached --quiet; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          git commit -m "fix: persist admin skill buff and nerf changes"
          git push
