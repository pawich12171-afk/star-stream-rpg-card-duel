name: Fix character persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch character persistence
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/services/characterService.ts')
          text = path.read_text(encoding='utf-8')

          old = '''  // Update Firestore
          try {
            const cleaned = sanitizeForFirestore(updated);
            await setDoc(doc(db, CHARACTERS_COLLECTION, updated.id), cleaned);
          } catch (err) {
            pendingCharacterUpdates.delete(updated.id);
            console.error("Error updating character in Firestore:", err);
            throw err;
          }
          '''

          new = '''  // Update Firestore through a per-character queue. This guarantees that rapid
          // saves finish in the same order they were requested, so an older write can
          // never complete after a newer write and overwrite it on the server.
          return enqueueCharacterWrite(updated.id, async () => {
            try {
              const cleaned = sanitizeForFirestore(updated);
              await setDoc(doc(db, CHARACTERS_COLLECTION, updated.id), cleaned);
            } catch (err) {
              // Only clear the pending version if this exact queued write failed.
              // A newer save may already be waiting in the queue.
              if (pendingCharacterUpdates.get(updated.id) === updated) {
                pendingCharacterUpdates.delete(updated.id);
              }
              console.error("Error updating character in Firestore:", err);
              throw err;
            }
          });
          '''

          if old in text:
              text = text.replace(old, new, 1)
          elif 'return enqueueCharacterWrite(updated.id, async () =>' in text:
              print('Character write queue already installed')
          else:
              raise SystemExit('Target Firestore write block not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/characterService.ts
          if git diff --cached --quiet; then
            echo 'No source changes needed'
            exit 0
          fi
          git commit -m 'fix: serialize character Firestore saves'
          git push
