name: Fix skill delete persistence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch skill deletion and Firebase persistence
        shell: python
        run: |
          from pathlib import Path
          import re

          status_path = Path('src/components/StatusWindow.tsx')
          text = status_path.read_text(encoding='utf-8')

          old = '''  const handleDeleteSkill = (skillId: string) => {
    if (confirm('คุณต้องการลบสกิลนี้ใช่หรือไม่?')) {
      onUpdateCharacter({
        ...character,
        skills: character.skills.filter(s => s.id !== skillId),
      });
    }
  };'''

          new = '''  const handleDeleteSkill = (skillId: string) => {
    if (!confirm('คุณต้องการลบสกิลนี้ใช่หรือไม่?')) return;

    const remainingSkills = (character.skills || []).filter(s => s.id !== skillId);
    const remainingModifiers = (character.adminBalanceModifiers || [])
      .filter(m => !(m.kind === 'skill' && m.skillId === skillId));

    // The deleted skill must also disappear from the admin snapshot.
    // Otherwise the realtime health synchronizer can reconstruct it from the old snapshot.
    const nextSnapshot = character.adminBalanceSnapshot
      ? {
          ...character.adminBalanceSnapshot,
          skills: (character.adminBalanceSnapshot.skills || []).filter(s => s.id !== skillId),
          capturedAt: Date.now(),
        }
      : undefined;

    onUpdateCharacter({
      ...character,
      skills: remainingSkills,
      adminBalanceSnapshot: remainingModifiers.length ? nextSnapshot : undefined,
      adminBalanceModifiers: remainingModifiers,
      adminStatusEffects: character.adminStatusEffects || [],
      lastUpdated: Date.now() + 1000,
    });
  };'''

          if old in text:
              text = text.replace(old, new, 1)
              status_path.write_text(text, encoding='utf-8')
          elif 'const handleDeleteSkill' not in text:
              raise SystemExit('handleDeleteSkill was not found')

          service_path = Path('src/services/characterService.ts')
          service = service_path.read_text(encoding='utf-8')

          old_start = '''export async function updateCharacterData(char: CharacterProfile): Promise<void> {
  const synced = syncCharacterHealth(char);
  const score = calculatePowerScore(synced);'''
          new_start = '''export async function updateCharacterData(char: CharacterProfile): Promise<void> {
  // IMPORTANT: persist exactly what the caller edited. Do not run the admin
  // synchronizer before writing to Firestore, because its browser recovery
  // overlay can contain an older BUFF/NERF/snapshot and resurrect deleted data.
  const synced = char;
  const score = calculatePowerScore(synced);'''

          if old_start in service:
              service = service.replace(old_start, new_start, 1)
          else:
              # Already patched is fine; anything else is a real failure.
              if new_start not in service:
                  raise SystemExit('updateCharacterData source pattern was not found')

          service_path.write_text(service, encoding='utf-8')

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StatusWindow.tsx src/services/characterService.ts
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: persist skill deletion directly to Firestore"
          git push origin HEAD:main
