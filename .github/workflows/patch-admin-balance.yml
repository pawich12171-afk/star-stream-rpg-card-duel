name: Wire admin balance panel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-admin-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire component into App
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import { AdminCharacterBalancePanel } from './components/AdminCharacterBalancePanel';"
          if import_line not in text:
              marker = "import { AdminPanel } from './components/AdminPanel';"
              if marker not in text:
                  raise SystemExit('AdminPanel import marker not found')
              text = text.replace(marker, marker + "\n" + import_line, 1)

          block = """        {activeTab === 'admin' && (\n          <AdminCharacterBalancePanel\n            characters={characters}\n            onUpdateCharacter={handleUpdateCharacter}\n          />\n        )}\n"""
          if block not in text:
              marker = "      </main>"
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit('main closing marker not found')
              text = text[:pos] + block + "\n" + text[pos:]

          path.write_text(text, encoding='utf-8')

      - name: Commit app wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/patch-admin-balance.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add real-time admin character balance controls"
          git push
