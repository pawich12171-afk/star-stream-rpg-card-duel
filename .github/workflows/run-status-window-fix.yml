name: run-status-window-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: node scripts/apply-status-window-fix.cjs
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StatusWindow.tsx
          git rm scripts/apply-status-window-fix.cjs .github/workflows/run-status-window-fix.yml
          git commit -m "fix: stabilize status saves"
          git push
